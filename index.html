<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Harcamalarını saniyeler içinde kaydet, grafiklerle bütçeni takip et. Kişisel finans takip uygulaması."
    />
    <meta name="theme-color" content="#2563eb" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Finansal Takip Merkezi</title>
    <!-- Tema, sayfa çizilmeden önce uygulanır (açılışta beyaz parlama olmasın). -->
    <script>
      (function () {
        // Tema listesi src/services/tema.js ile aynı olmalı: [tarayıcı rengi, koyu mu]
        var TEMALAR = {
          acik: ["#2563eb", false],
          okyanus: ["#0f766e", false],
          kahve: ["#8b5a34", false],
          koyu: ["#0f172a", true],
          gece: ["#000000", true],
          ametist: ["#130f1f", true],
        };
        var tema = null;
        try {
          tema = localStorage.getItem("tema");
        } catch (e) {}
        // Kayıtlı (ve geçerli) bir seçim yoksa cihazın tercihi kullanılır.
        if (!Object.prototype.hasOwnProperty.call(TEMALAR, tema))
          tema = matchMedia("(prefers-color-scheme: dark)").matches
            ? "koyu"
            : "acik";
        var kok = document.documentElement;
        kok.dataset.tema = tema;
        if (TEMALAR[tema][1]) kok.classList.add("dark");
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", TEMALAR[tema][0]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
