<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Harcamalarını saniyeler içinde kaydet, grafiklerle bütçeni takip et. Kişisel finans takip uygulaması."
    />
    <meta name="theme-color" content="#2563eb" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Finansal Takip Merkezi</title>
    <!-- Tema, sayfa çizilmeden önce uygulanır (açılışta beyaz parlama olmasın). -->
    <script>
      (function () {
        try {
          var tema = localStorage.getItem("tema");
          var koyu =
            tema === "koyu" ||
            (!tema && matchMedia("(prefers-color-scheme: dark)").matches);
          if (koyu) {
            document.documentElement.classList.add("dark");
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#0f172a");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
