[build]
  command = "npm run build"
  publish = "dist"

# Netlify .webmanifest uzantısını tanımadığı için içerik türü elle verilir.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
